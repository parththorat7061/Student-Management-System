{% extends "base.html" %}

{% block title %}Error {{ error_code }} - Student Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card border-danger">
            <div class="card-body py-5">
                <i class="bi bi-exclamation-triangle-fill display-1 text-danger"></i>
                <h1 class="display-4 mt-3">{{ error_code }}</h1>
                <p class="lead text-muted">{{ message }}</p>
                <hr>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                    <i class="bi bi-house-door"></i> Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
